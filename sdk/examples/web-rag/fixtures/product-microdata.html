<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Microdata Product — Shop</title>
</head>
<body>
  <main>
    <div itemscope itemtype="https://schema.org/Product">
      <h1 itemprop="name">Classic Hoodie</h1>
      <p itemprop="description">Soft cotton blend hoodie available in multiple colors.</p>
      <span itemprop="price" content="75.00">$75.00</span>
      <meta itemprop="priceCurrency" content="USD" />
      <link itemprop="availability" href="https://schema.org/OutOfStock" />
    </div>
  </main>
</body>
</html>
